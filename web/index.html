          if (isLand) {

          }

          return true;

        window.__isPixelAllowed = isPixelAllowed;

        // 3. Permanent FBQ & _FBQ Shield
        var internalFbq = null;

        var guardedFbq = function() {
          var cmd = arguments[0];
          var pid = arguments[1];
          if (cmd === 'init' || cmd === 'trackSingle' || cmd === 'trackSingleCustom') {
            if (!isPixelAllowed(pid)) {

          return false;

        function shouldBlockPixelUrl(url) {
          if (!url || typeof url !== 'string') return false;
          if (url.indexOf('facebook.com/tr') === -1) return false;
          var match = url.match(/[?&]id=([0-9]+)/);

        if (typeof window.fetch === 'function') {

            if (shouldBlockPixelUrl(u) || shouldBlockGtmUrl(u)) {

            }
            return origFetch.apply(this, arguments);

        if (typeof window.XMLHttpRequest === 'function') {

          var origXhrSend = XMLHttpRequest.prototype.send;
          XMLHttpRequest.prototype.open = function(method, url) {
            this.__blockedByShield = shouldBlockPixelUrl(url) || shouldBlockGtmUrl(url);

          };

            if (this.__blockedByShield) {

            return origXhrSend.apply(this, arguments);

          var origImgSrcDescriptor = Object.getOwnPropertyDescriptor(imgProto, 'src');
          if (origImgSrcDescriptor && origImgSrcDescriptor.set) {

                return origImgSrcDescriptor.get.call(this);

              }
            });
          }
        } catch (_) {}

        try {
          var scriptProto = HTMLScriptElement.prototype;
          var origScriptSrcDescriptor = Object.getOwnPropertyDescriptor(scriptProto, 'src');
          if (origScriptSrcDescriptor && origScriptSrcDescriptor.set) {

        // 5. Auto-initialize custom landing pixel immediately via Auto Code Brain
        var lt = window.__LANDING_TRACKING__;
        if (lt && lt.fbPixelId) {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://connect.facebook.net/en_US/fbevents.js';
          var f = document.getElementsByTagName('script')[0];
          if (f && f.parentNode) f.parentNode.insertBefore(s, f);
          else document.head.appendChild(s);

          var initPid = String(lt.fbPixelId).trim();
          window.fbq('init', initPid);
          var pvOpts = lt.fbTestCode ? { test_event_code: String(lt.fbTestCode).trim() } : undefined;
          if (lt.pixelMode !== 'both') {
            if (pvOpts) window.fbq('trackSingle', initPid, 'PageView', {}, pvOpts);
            else window.fbq('trackSingle', initPid, 'PageView');

            if (pvOpts) window.fbq('track', 'PageView', {}, pvOpts);

        if (lt && lt.ttkPixelId) {
          var tid = String(lt.ttkPixelId).trim();
          if (!window.ttq) {

            var ttq = (window.ttq = []);
