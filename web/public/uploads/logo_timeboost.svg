<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="20%" stop-color="#FCE182" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#F3D063" />
    </linearGradient>
    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Emblem: Golden Precision Chrono + Power Boost Surge -->
  <g transform="translate(18, 15)" filter="url(#logoShadow)">
    <!-- Outer Precision Ring -->
    <circle cx="45" cy="45" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="45" cy="45" r="36" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8" />
    
    <!-- Stopwatch Tick Marks -->
    <line x1="45" y1="5" x2="45" y2="12" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="45" y1="78" x2="45" y2="85" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="5" y1="45" x2="12" y2="45" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="78" y1="45" x2="85" y2="45" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Center Monogram "T" in Brushed Gold -->
    <path d="M26 26 L64 26 L64 34 L49 34 L49 64 L41 64 L41 34 L26 34 Z" fill="url(#goldGrad)" />
    
    <!-- Dynamic Lightning / Boost Arrow overlaid in Pure White & Amber -->
    <path d="M48 35 L62 47 L51 49 L58 64 L43 51 L52 49 Z" fill="#FFFFFF" opacity="0.95" />
    <circle cx="45" cy="45" r="3" fill="url(#goldGrad)" />
  </g>

  <!-- Typography -->
  <!-- Brand Name: TIMEBOOST -->
  <text x="125" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="url(#goldGrad)" filter="url(#logoShadow)">
    TIME<tspan fill="#FFFFFF" font-weight="800">BOOST</tspan>
  </text>

  <!-- Tagline -->
  <text x="128" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="6" fill="#94A3B8">
    PREMIUM WELLNESS &amp; TIMING
  </text>

  <!-- Accent Bottom Line -->
  <rect x="128" y="98" width="190" height="2.5" rx="1.25" fill="url(#goldGrad)" />
  <circle cx="324" cy="99" r="2.5" fill="#FFFFFF" />
</svg>